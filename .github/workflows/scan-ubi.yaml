name: Vulnerability scan - UBI

on:
  workflow_dispatch:
  schedule:
  - cron: '00 4 * * 1-5'

permissions:
  contents: read

jobs:
  versions:
    name: Load supported versions
    permissions:
      contents: read
    uses: ./.github/workflows/supported-versions.yaml

  scan:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    permissions:
      contents: read
    uses: ./.github/workflows/scan.yaml
    with:
      check-scan-error: true
      registry: ghcr.io/controlplaneio/ubi
      variant: UBI
      version: ${{ matrix.version }}
    secrets:
      pull-token: ${{ secrets.GHCR_READONLY }}
      zulip-email: ${{ secrets.ZULIP_EMAIL }}
      zulip-api-key: ${{ secrets.ZULIP_API_KEY }}
      zulip-organization-url: ${{ secrets.ZULIP_ORGANIZATION_URL }}
