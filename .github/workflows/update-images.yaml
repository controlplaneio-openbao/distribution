# Refresh the per-variant OpenBao image digest pins under
# images/<version>/. Dispatch after a build round publishes new digests
# in ghcr.io/controlplaneio/<variant>/openbao:<version>.
name: Update images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenBao version, e.g. v2.6.2 (empty = images/VERSION)'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/controlplaneio
  DISTRIBUTION: enterprise

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READONLY }}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(cat images/VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Enterprise images
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/workflows/update-images.sh
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update images for OpenBao ${{ steps.version.outputs.version }}
          committer: GitHub <noreply@github.com>
          signoff: true
          branch: update-images-${{ steps.version.outputs.version }}
          title: Update images for OpenBao ${{ steps.version.outputs.version }}
          body: |
            Update image digests for OpenBao ${{ steps.version.outputs.version }}.
          labels: |
            area/images
