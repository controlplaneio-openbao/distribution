# Reusable vulnerability scan for one OpenBao image flavor.
#
# Callers (scan-ubi.yaml, scan-distroless.yaml) pass the variant registry and run it once per supported version
# (see supported-versions.yaml). The -fips variants are intentionally NOT scanned: they differ from their non-fips
# counterparts only by the embedded Go FIPS module and carry the same OS and library packages (same reason flux
# does not scan distroless-fips).
name: scan

on:
  workflow_call:
    inputs:
      registry:
        description: 'image registry address, e.g. ghcr.io/controlplaneio/ubi'
        required: true
        type: string
      severity:
        description: 'vulnerability severity'
        required: false
        type: string
        default: 'CRITICAL,HIGH,MEDIUM,LOW'
      check-scan-error:
        description: 'fail the job when the scan finds vulnerabilities'
        required: false
        type: boolean
        default: true
      variant:
        description: 'image variant'
        required: true
        type: string
      version:
        description: 'image version, e.g. v2.7.2'
        required: true
        type: string
    secrets:
      pull-token:
        description: 'GHCR read-only token for the OpenBao packages'
        required: true
      zulip-email:
        description: 'Zulip bot email for CVE alerts'
        required: false
      zulip-api-key:
        description: 'Zulip bot API key for CVE alerts'
        required: false
      zulip-organization-url:
        description: 'Zulip organization URL for CVE alerts'
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      job-url: ${{ steps.job-url.outputs.url }}
    steps:
      - name: Record job URL
        id: job-url
        run: echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.pull-token }}

      - name: Resolve image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          minor="v$(echo "${version#v}" | cut -d. -f1,2)"
          image="${{ inputs.registry }}/openbao:${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Scanning $image"

      - name: Scan with trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          image-ref: ${{ steps.image.outputs.image }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: ${{ inputs.severity }}
          trivyignores: .trivyignore,releases/release-${{ steps.image.outputs.minor }}.trivyignore
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.pull-token }}

      - name: Scan result
        shell: bash
        run: |
          echo "image: ${{ steps.image.outputs.image }}"
          echo "trivy: ${{ steps.trivy.outcome }}"

      - name: Check result
        if: inputs.check-scan-error && steps.trivy.outcome == 'failure'
        shell: bash
        run: |
          echo "Vulnerabilities found in ${{ steps.image.outputs.image }}"
          exit 1

  notify-zulip:
    needs: scan
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
      with:
        email: ${{ secrets.zulip-email }}
        api-key: ${{ secrets.zulip-api-key }}
        organization-url: ${{ secrets.zulip-organization-url }}
        type: stream
        to: Distribution
        topic: cve-alerts
        content: 'OpenBao Enterprise ${{ inputs.variant }} ${{ inputs.version }} CVE alert: ${{ needs.scan.outputs.job-url }}'
